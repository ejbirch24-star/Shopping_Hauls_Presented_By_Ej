<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Shopping Wishlist</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-size: 38px;
      font-weight: 800;
    }

    p.subtitle {
      color: #444;
      margin-bottom: 35px;
      font-size: 18px;
    }

    .item-container {
      max-width: 900px;
      background: white;
      margin: 40px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
    }

    .item-container img {
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .item-title {
      font-size: 26px;
      font-weight: 700;
      margin-top: 8px;
    }

    .btn {
      display: inline-block;
      background: #003366;
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-size: 18px;
      margin-top: 14px;
      text-decoration: none;
      transition: 0.2s ease-in-out;
    }

    .btn:hover {
      background: #0055aa;
    }

  </style>
</head>
<body>

  <h1>My Shopping Wishlist🛍️</h1>
  <p class="subtitle">Scroll down and click on any button to view the item on its respective website</p>

   <!-- 1. Nike Dunks (Brown) -->
  <div class="item-container">
    <img src="https://media.finishline.com/i/finishline/FQ8249_104_P1?bg=rgb%28237%2C237%2C237%29&fmt=auto&w=640&h=640" alt="Nike Dunks Brown">
    <div class="item-title">Nike Dunks (Brown)</div>
    <a class="btn" href="https://www.finishline.com/pdp/mens-nike-dunk-low-retro-casual-shoes/prod2823495/FQ8249/104?rdrprev=true&utm_content=pmax&gad_source=1&gad_campaignid=23164570272&gbraid=0AAAAADo4gB8kOhH3_umV2cJbXiXKk2Mfx&gclid=CjwKCAiAlrXJBhBAEiwA-5pgwhGYu4CxiBa3NAYoy0xNiroTT7w_xqFYEu7zavVuL-h-DmfkejpAwBoCKDkQAvD_BwE" target="_blank">
      View on Finish Line
    </a>
  </div>

</body>
</html>
